<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remates Inmobiliarios Chile 2026 - Google Sheets App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .sheet-grid th, .sheet-grid td { border: 1px solid #e2e8f0; }
        .tab-btn-active { background-color: #059669 !important; color: #ffffff !important; border-color: #047857 !important; }
        .tab-btn-inactive { background-color: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col text-slate-800">

    <header class="bg-white border-b border-slate-200 px-4 py-3 flex flex-wrap items-center justify-between gap-4 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-emerald-600 text-white p-2.5 rounded-xl shadow-md"><i class="fa-solid fa-file-excel text-2xl"></i></div>
            <div>
                <h1 class="font-bold text-xl text-slate-900 leading-tight">Remates Judiciales & Inmobiliarios Chile 2026</h1>
                <div class="flex items-center space-x-4 text-xs text-slate-500 mt-1">
                    <span><i class="fa-solid fa-calendar-check mr-1 text-emerald-500"></i> Filtrado: Fechas futuras activas</span>
                    <span class="bg-slate-800 text-white px-2 py-0.5 rounded-full font-bold">Autoría: Daniel Olivares M.</span>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="runScrapingWithGemini()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold px-3.5 py-2 rounded-lg text-sm transition active:scale-95"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i> Actualizar IA</button>
            <button onclick="copyTableToClipboard()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow transition"><i class="fa-solid fa-copy mr-2"></i> Copiar a Sheets</button>
        </div>
    </header>

    <main class="flex-1 overflow-auto p-4">
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-left text-sm border-collapse">
                <thead class="bg-slate-900 text-white text-xs uppercase">
                    <tr>
                        <th class="p-3">ID</th>
                        <th class="p-3">Origen</th>
                        <th class="p-3">Descripción</th>
                        <th class="p-3">Comuna</th>
                        <th class="p-3 text-right">Mínimo</th>
                        <th class="p-3 text-right">Garantía</th>
                        <th class="p-3 text-center">Fecha Remate</th>
                        <th class="p-3 text-center">Acción</th>
                    </tr>
                </thead>
                <tbody id="rematesTbody" class="divide-y divide-slate-200"></tbody>
            </table>
        </div>
    </main>

    <script>
        // Fechas a partir de 01-08-2026 para el filtro de "futuros"
        const rematesData = [
            { id: "TAT-5011", portal: "Tattersall", desc: "Depto 88m² Vitacura", comuna: "Vitacura", minimo: "UF 3.850", garantiaVal: 14000000, fecha: "27-08-2026", url: "#" },
            { id: "C-14017-2022", portal: "PJUD", desc: "San Diego 1340", comuna: "Santiago", minimo: "$60M", garantiaVal: 6000000, fecha: "10-08-2026", url: "#" },
            { id: "C-36019-2019", portal: "PJUD", desc: "Edificio Cumbres", comuna: "Coquimbo", minimo: "$529M", garantiaVal: 52986584, fecha: "31-08-2026", url: "#" },
            { id: "DIC-INM-01", portal: "DICREP", desc: "Casa La Serena", comuna: "La Serena", minimo: "$38M", garantiaVal: 3800000, fecha: "15-08-2026", url: "#" }
        ];

        function renderFilteredTable() {
            const today = new Date("2026-07-31");
            const tbody = document.getElementById("rematesTbody");
            tbody.innerHTML = "";

            rematesData.filter(r => {
                const parts = r.fecha.split("-");
                const rDate = new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
                return rDate > today;
            }).forEach(item => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50";
                tr.innerHTML = `
                    <td class="p-3 font-bold text-xs">${item.id}</td>
                    <td class="p-3 text-xs">${item.portal}</td>
                    <td class="p-3 text-xs">${item.desc}</td>
                    <td class="p-3 text-xs">${item.comuna}</td>
                    <td class="p-3 text-xs text-right font-bold">${item.minimo}</td>
                    <td class="p-3 text-xs text-right text-emerald-700">$${item.garantiaVal.toLocaleString()}</td>
                    <td class="p-3 text-xs text-center font-mono">${item.fecha}</td>
                    <td class="p-3 text-center"><a href="${item.url}" class="text-blue-600 hover:underline">Ver</a></td>
                `;
                tbody.appendChild(tr);
            });
        }

        window.onload = renderFilteredTable;
    </script>
</body>
</html>
